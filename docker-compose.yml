services:
  rachelbot:
    build: .
    ports:
      - "18789:18789"
    env_file:
      - .env
    environment:
      RACHELBOT_STATE_DIR: /data
      RACHELBOT_WORKSPACE: /data/workspace
      RACHELBOT_CONFIG_PATH: /data/rachelbot.json
    volumes:
      - rachelbot_data:/data
    restart: unless-stopped

volumes:
  rachelbot_data:
